[package]
name = "veld"
description = "The Veld CLI: contract-first API code generation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "veld"
path = "src/main.rs"

[dependencies]
veld-ir.workspace = true
veld-compiler.workspace = true
veld-codegen.workspace = true
veld-project.workspace = true
veld-tools.workspace = true
veld-lsp = { path = "../../crates/veld-lsp" }
veld-plugin-host.workspace = true
veld-registry-client.workspace = true
semver.workspace = true
veld-emit-java.workspace = true
veld-emit-node.workspace = true
veld-emit-typescript.workspace = true
clap.workspace = true
anyhow.workspace = true
serde_json.workspace = true
toml.workspace = true
notify.workspace = true
cliclack = "=0.5.7"
console = "=0.16.6"
ctrlc = "=3.5.3"
time = { version = "=0.3.55", features = ["local-offset"] }

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
ureq.workspace = true
insta.workspace = true
veld-test-support.workspace = true

[lints]
workspace = true
