[workspace]
resolver = "3"
members = [
  "crates/veld-ir",
  "crates/veld-project",
  "crates/veld-compiler",
  "crates/veld-tools",
  "crates/veld-registry-client",
  "crates/veld-lsp",
  "crates/veld-codegen",
  "crates/veld-plugin-host",
  "crates/veld-emit-conformance",
  "crates/emitters/typescript",
  "crates/emitters/node",
  "crates/emitters/java",
  "xtask",
  "apps/veld",
]

[workspace.package]
version = "2.0.0-beta.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/Adhamzineldin/Veld"
rust-version = "1.90"

[workspace.dependencies]
veld-ir = { path = "crates/veld-ir" }
veld-compiler = { path = "crates/veld-compiler" }
veld-codegen = { path = "crates/veld-codegen" }
veld-project = { path = "crates/veld-project" }
veld-tools = { path = "crates/veld-tools" }
veld-plugin-host = { path = "crates/veld-plugin-host" }
veld-registry-client = { path = "crates/veld-registry-client" }
veld-emit-conformance = { path = "crates/veld-emit-conformance" }
veld-emit-node = { path = "crates/emitters/node" }
veld-emit-typescript = { path = "crates/emitters/typescript" }
veld-emit-java = { path = "crates/emitters/java" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
anyhow = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
insta = { version = "1", features = ["json"] }
assert_cmd = "2"
predicates = "3"
lsp-server = "0.7"
lsp-types = "0.97"
notify = "6"
ureq = { version = "2", default-features = false, features = ["tls"] }
semver = { version = "1", features = ["serde"] }
flate2 = "1"
tar = { version = "0.4", default-features = false }
toml_edit = "0.22"
url = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
