name: release

# Pushing a tag such as v2.0.0-beta.1 builds the `veld` CLI and `veld-registry`
# for every supported platform and attaches the archives plus SHA256SUMS to the
# GitHub release. The distribution wrappers (npm, pip, Homebrew) download these
# exact asset names:
#
#   veld-<target-triple>.tar.gz            (veld.zip on Windows)
#   veld-registry-linux-<amd64|arm64>.tar.gz
#   SHA256SUMS

on:
  push:
    tags: ["v*"]
  # A dry run builds every artifact and uploads it as a workflow artifact. It creates no release
  # and pushes no image.
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build and upload artifacts only: no release, no image push"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  veld:
    name: veld (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-latest,  cross: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest,  cross: true }
          - { target: x86_64-apple-darwin,        os: macos-15-intel, cross: false }
          - { target: aarch64-apple-darwin,       os: macos-latest,   cross: false }
          - { target: x86_64-pc-windows-msvc,     os: windows-latest, cross: false }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build (cross)
        if: matrix.cross
        run: cross build -p veld --release --locked --target ${{ matrix.target }}
      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build -p veld --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          exe=veld; if [ "$RUNNER_OS" = Windows ]; then exe=veld.exe; fi
          bash distribution/package.sh veld "${{ matrix.target }}" "target/${{ matrix.target }}/release/$exe" dist
      - uses: actions/upload-artifact@v4
        with:
          name: veld-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  registry:
    name: veld-registry (linux-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: registry/go.mod
      - name: Build
        working-directory: registry
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p ../dist/stage
          go build -trimpath -ldflags="-s -w" -o ../dist/stage/veld-registry ./cmd/veld-registry
          bash ../distribution/package.sh registry "${{ matrix.goarch }}" ../dist/stage/veld-registry ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: veld-registry-linux-${{ matrix.goarch }}
          path: dist/*.tar.gz

  docker:
    name: registry docker image
    runs-on: ubuntu-latest
    env:
      # Secrets cannot be used in `if:` directly, so they are mirrored here.
      # Only a tag push may push an image; a dry run never sees the credentials.
      DOCKERHUB_USERNAME: ${{ startsWith(github.ref, 'refs/tags/') && secrets.DOCKERHUB_USERNAME || '' }}
      DOCKERHUB_TOKEN: ${{ startsWith(github.ref, 'refs/tags/') && secrets.DOCKERHUB_TOKEN || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the image (no push without credentials)
        if: env.DOCKERHUB_TOKEN == ''
        run: docker build -t veld-registry registry/
      - uses: docker/setup-buildx-action@v3
        if: env.DOCKERHUB_TOKEN != ''
      - uses: docker/login-action@v3
        if: env.DOCKERHUB_TOKEN != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image tags
        if: env.DOCKERHUB_TOKEN != ''
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/veld-registry
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@v6
        with:
          context: registry
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  checksums:
    name: SHA256SUMS
    needs: [veld, registry]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: |
          set -euo pipefail
          ls -l
          bash ../distribution/package.sh sums .
      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS

  publish:
    name: github release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [checksums]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  wrappers:
    name: wrapper tests (npm, pip, homebrew)
    needs: [checksums]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: artifacts
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: npm wrapper
        run: node distribution/tests/npm-wrapper.test.js artifacts
      - name: pip wrapper
        run: python distribution/tests/pip_wrapper_test.py artifacts
      - name: homebrew formula
        run: bash distribution/tests/homebrew-formula.test.sh artifacts/SHA256SUMS
