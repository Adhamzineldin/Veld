name: release

# Pushing a tag such as v2.0.0-beta.1 builds the `veld` CLI and `veld-registry`
# for every supported platform and attaches the archives plus SHA256SUMS to the
# GitHub release. The distribution wrappers (npm, pip, Homebrew) download these
# exact asset names:
#
#   veld-<target-triple>.tar.gz            (veld.zip on Windows)
#   veld-registry-linux-<amd64|arm64>.tar.gz
#   SHA256SUMS

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  veld:
    name: veld (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-latest,  cross: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest,  cross: true }
          - { target: x86_64-apple-darwin,        os: macos-13,       cross: false }
          - { target: aarch64-apple-darwin,       os: macos-latest,   cross: false }
          - { target: x86_64-pc-windows-msvc,     os: windows-latest, cross: false }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build (cross)
        if: matrix.cross
        run: cross build -p veld --release --locked --target ${{ matrix.target }}
      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build -p veld --release --locked --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="veld-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/veld" "dist/$name/"
          tar -C "dist/$name" -czf "dist/$name.tar.gz" .
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "veld-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/veld.exe" "dist/$name/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: veld-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  registry:
    name: veld-registry (linux-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: registry/go.mod
      - name: Build
        working-directory: registry
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p ../dist/stage
          go build -trimpath -ldflags="-s -w" -o ../dist/stage/veld-registry ./cmd/veld-registry
          tar -C ../dist/stage -czf ../dist/veld-registry-linux-${{ matrix.goarch }}.tar.gz veld-registry
      - uses: actions/upload-artifact@v4
        with:
          name: veld-registry-linux-${{ matrix.goarch }}
          path: dist/*.tar.gz

  docker:
    name: registry docker image
    runs-on: ubuntu-latest
    env:
      # Secrets cannot be used in `if:` directly, so they are mirrored here.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the image (no push without credentials)
        if: env.DOCKERHUB_TOKEN == ''
        run: docker build -t veld-registry registry/
      - uses: docker/setup-buildx-action@v3
        if: env.DOCKERHUB_TOKEN != ''
      - uses: docker/login-action@v3
        if: env.DOCKERHUB_TOKEN != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image tags
        if: env.DOCKERHUB_TOKEN != ''
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/veld-registry
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@v6
        with:
          context: registry
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  publish:
    name: github release
    needs: [veld, registry]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: |
          set -euo pipefail
          ls -l
          sha256sum *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
