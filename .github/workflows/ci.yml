name: CI

# ─── RUNS ON ────────────────────────────────────────────────────────────────
# Every push to master/main and every pull request.
# No secrets needed — this is read-only (build + test + vet).
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -count=1

  drift:
    name: Generated files up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      # The plugin language specs are generated from internal/language/constants.go.
      # Editing them by hand silently desyncs the two editors from the lexer.
      - name: Regenerate plugin language specs
        run: go run ./cmd/generate-language

      # The canonical config schema is copied into both plugins by this script.
      - name: Resync editor config schemas
        run: bash scripts/sync-schema.sh

      - name: Fail if anything changed
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated files are out of date. Run these locally and commit the result:"
            echo "  go run ./cmd/generate-language"
            echo "  bash scripts/sync-schema.sh"
            git --no-pager diff --stat
            exit 1
          fi
          echo "✓ All generated files are up to date"

  build-check:
    name: Build (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          go build -o "veld${EXT}" ./cmd/veld
          echo "✓ Built veld for ${GOOS}/${GOARCH}"

