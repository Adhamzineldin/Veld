name: ci

on:
  push:
    branches: [master, "feat/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Both JDKs are installed; the last one (21) is the default on PATH. javac 21 compiles the
      # generated code for `--release 17` and `--release 21` (the version matrix of the toolchain tests).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - name: Install the pinned TypeScript toolchain
        run: npm ci --prefix tests/toolchain/ts
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (the toolchain tests must run, not skip)
        run: cargo test --workspace
        env:
          VELD_REQUIRE_TOOLCHAINS: "1"

  java17:
    name: generated Java runs on a JDK 17 JVM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install the pinned TypeScript toolchain
        run: npm ci --prefix tests/toolchain/ts
      - name: Java toolchain tests with javac and java 17 (release 17 only)
        run: cargo test -p veld-emit-java --test toolchain
        env:
          VELD_REQUIRE_TOOLCHAINS: "1"
          VELD_JAVA_RELEASES: "17"

  spring:
    name: generated Spring adapter runs in Spring Boot 3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: tests/toolchain/java/spring/pom.xml
      - name: Install the pinned TypeScript toolchain
        run: npm ci --prefix tests/toolchain/ts
      - name: Build the Spring Boot application with the Maven Wrapper and call it from the generated clients
        run: cargo test -p veld-emit-java --test toolchain spring_adapter_serves_the_round_trip
        env:
          VELD_REQUIRE_TOOLCHAINS: "1"
          VELD_JAVA_RELEASES: "17"

  determinism:
    name: determinism (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build veld
        run: cargo build -p veld
      - name: Generate the same workspace twice, in two directories
        shell: bash
        run: |
          set -euo pipefail
          veld="$PWD/target/debug/veld"
          for run in a b; do
            dir="$RUNNER_TEMP/determinism-$run"
            rm -rf "$dir"
            mkdir -p "$dir"
            cp -R tests/toolchain/contract "$dir/contracts"
            cat > "$dir/veld.toml" <<'TOML'
          [project]
          name = "contract"

          [services.iam]
          contracts = "contracts/iam"

          [services.orders]
          contracts = "contracts/orders"

          [[targets]]
          name = "orders-api"
          role = "server"
          emitter = "node"
          service = "orders"
          out = "out/orders"

          [[targets]]
          name = "web"
          role = "client"
          emitter = "typescript"
          out = "out/web"
          TOML
            (cd "$dir" && "$veld" generate)
          done
          diff -r "$RUNNER_TEMP/determinism-a/out" "$RUNNER_TEMP/determinism-b/out"
          diff "$RUNNER_TEMP/determinism-a/veld.lock.ir.json" "$RUNNER_TEMP/determinism-b/veld.lock.ir.json"

  codegen:
    name: generated files are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask codegen --check

  registry:
    name: registry (Go server and e2e)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: veld
          POSTGRES_PASSWORD: veld
          POSTGRES_DB: veld
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veld"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CARGO_TERM_COLOR: always
      # The e2e test starts its own throwaway cluster with these server binaries.
      VELD_PG_BIN: /usr/lib/postgresql/16/bin
      VELD_REQUIRE_TOOLCHAINS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: registry/go.mod
          cache-dependency-path: registry/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Go vet and tests
        working-directory: registry
        run: |
          go vet ./...
          go test ./...
      - name: Registry client unit tests
        run: cargo test -p veld-registry-client
      - name: Registry end-to-end test (real registry and PostgreSQL)
        run: |
          test -x "$VELD_PG_BIN/initdb" || { echo "no PostgreSQL server binaries in $VELD_PG_BIN"; ls /usr/lib/postgresql; exit 1; }
          cargo test -p veld --test registry_e2e -- --nocapture
