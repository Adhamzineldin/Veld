name: ci

on:
  push:
    branches: [master, "feat/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install the pinned TypeScript toolchain
        run: npm ci --prefix tests/toolchain/ts
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (the toolchain tests must run, not skip)
        run: cargo test --workspace
        env:
          VELD_REQUIRE_TOOLCHAINS: "1"

  determinism:
    name: determinism (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build veld
        run: cargo build -p veld
      - name: Generate the same workspace twice, in two directories
        shell: bash
        run: |
          set -euo pipefail
          veld="$PWD/target/debug/veld"
          for run in a b; do
            dir="$RUNNER_TEMP/determinism-$run"
            rm -rf "$dir"
            mkdir -p "$dir"
            cp -R tests/toolchain/contract "$dir/contracts"
            cat > "$dir/veld.toml" <<'TOML'
          [project]
          name = "contract"

          [services.iam]
          contracts = "contracts/iam"

          [services.orders]
          contracts = "contracts/orders"

          [[targets]]
          name = "orders-api"
          role = "server"
          emitter = "node"
          service = "orders"
          out = "out/orders"

          [[targets]]
          name = "web"
          role = "client"
          emitter = "typescript"
          out = "out/web"
          TOML
            (cd "$dir" && "$veld" generate)
          done
          diff -r "$RUNNER_TEMP/determinism-a/out" "$RUNNER_TEMP/determinism-b/out"
          diff "$RUNNER_TEMP/determinism-a/veld.lock.ir.json" "$RUNNER_TEMP/determinism-b/veld.lock.ir.json"

  codegen:
    name: generated files are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask codegen --check
