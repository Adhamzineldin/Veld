[package]
name = "rollout-serve-harness"
version = "0.0.0"
edition = "2021"
publish = false
default-run = "parties-serve"

[[bin]]
name = "parties-serve"
path = "src/bin/parties.rs"

[[bin]]
name = "tables-serve"
path = "src/bin/tables.rs"

[dependencies]
rollout-server = { path = "../server" }
rollout-client = { path = "../client" }
axum = "0.8"
reqwest = "0.13"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
