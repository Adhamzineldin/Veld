[package]
name = "flags-streams-harness"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
chat-server = { path = "../server" }
axum = "0.8"
reqwest = "0.13"
serde_json = "1"
futures-util = "0.3"
tokio-tungstenite = "0.30"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
