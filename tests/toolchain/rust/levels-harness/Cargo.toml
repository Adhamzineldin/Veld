[package]
name = "levels-harness"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "deadline"
path = "src/bin/deadline.rs"

[[bin]]
name = "slo"
path = "src/bin/slo.rs"

[dependencies]
rooms-server = { path = "../server" }
rooms-client = { path = "../client" }
axum = "0.8"
reqwest = "0.13"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
