[package]
name = "audit-harness"
version = "0.0.0"
edition = "2021"
publish = false
default-run = "audit-http"

[[bin]]
name = "audit-http"
path = "src/main.rs"

[dependencies]
bookings-server = { path = "../server" }
bookings-client = { path = "../client" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
