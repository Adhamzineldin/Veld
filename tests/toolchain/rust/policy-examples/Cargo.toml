[package]
name = "policy-examples"
version = "0.0.0"
edition = "2021"
publish = false
default-run = "policy-serve"

[[bin]]
name = "policy-serve"
path = "src/main.rs"

[dependencies]
bookings-server = { path = "../server" }
bookings-client = { path = "../client" }
axum = "0.8"
reqwest = "0.13"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
