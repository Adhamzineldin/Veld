server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  # Every contract path starts with /api/<service>, so one rule per service is enough.
  location /api/iam/ { proxy_pass http://iam-service:3001; }
  location /api/accounts/ { proxy_pass http://account-service:3002; }
  location /api/transactions/ { proxy_pass http://transaction-service:3003; }
  location /api/cards/ { proxy_pass http://card-service:3004; }
  location /api/notifications/ { proxy_pass http://notification-service:3005; }
}
