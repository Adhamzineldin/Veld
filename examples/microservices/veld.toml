# NexusBank: a contract-first banking platform with five services.
# Run `veld check` and `veld generate` in this directory.
#
# This file is the workspace root: the members and what they share. Each member has its own
# veld.toml next to its code (backend/<service>-service/veld.toml, web/veld.toml). Run `veld` inside
# a member's directory to work on that member only, or use `-p`, for example:
#   veld generate -p accounts
#   veld generate --affected --since origin/master
[workspace]
name = "nexusbank"
members = ["backend/*", "web"]

# Node servers use Express unless a service says otherwise.
[workspace.defaults.server.node]
framework = "express"
