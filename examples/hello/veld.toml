# One file is a whole workspace: a single service and its targets.
[service]
name = "hello"

# A Node.js server. Framework adapters use structural types, so the generated code has no
# dependencies. Choose express, fastify, hono, nest, node-http or none.
# After `veld generate`, `veld setup` makes it importable as `@veld/api`.
[server]
name = "api"
emitter = "node"
framework = "express"
out = "server/src/generated"

# A typed TypeScript client with React hooks, importable as `@veld/web`.
[client]
name = "web"
emitter = "typescript"
framework = "react"
out = "web/src/generated"
