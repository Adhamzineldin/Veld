# Two services share one library of contracts: `common`.
# Services import from it with `use common:<module>.{Name}`.
#
# This file is the workspace root. Each member has its own veld.toml in its directory:
#   contracts/common/veld.toml   the library
#   orders/veld.toml             a service and its server
#   invoices/veld.toml           a service and its server
#   web/veld.toml                an app: a client of every service
[workspace]
name = "shop"
members = ["contracts/common", "orders", "invoices", "web"]
