[workspace]
resolver = "2"

[package]
name = "book-catalog"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
catalog-server = { path = "generated/server" }
catalog-client = { path = "generated/client" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
